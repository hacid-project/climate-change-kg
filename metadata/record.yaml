# Descriptive metadata of the knowledge graph, written by hand, shared by:
#
# - its description as a dataset (kg/export/void.ttl, in the KG): the creators
#   (rule metadata_creators, metadata/creators.jq);
# - its record on Zenodo, of which each release is a version (rule release,
#   workflow/scripts/release.py): all the fields below, with the description
#   rendered from publication/templates/zenodo-description.md.
#
# The other fields of the Zenodo record are computed at each release: version,
# publication date, date of the build, the files, and the related identifiers
# given by the configuration (the workflow at the tag of the release, the
# snapshots of the sources, the ontologies, the website).

