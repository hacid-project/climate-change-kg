# keng.istc.cnr.it, port 443: the Climate Change Knowledge Graph, served by
# knowledge-graph-serve on 127.0.0.1:8081, under /climate-change-kg/.
# Installed in /etc/nginx/sites-available/ by deployment/install.sh.
# nginx 1.24 (Ubuntu 24.04): HTTP/2 is turned on in "listen" ("http2 on" needs 1.25.1).

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name keng.istc.cnr.it;
    server_tokens off;

    # Obtained and renewed by certbot (certbot.timer), which reloads nginx after a renewal.
    ssl_certificate     /etc/letsencrypt/live/keng.istc.cnr.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keng.istc.cnr.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location = / {
        return 302 /climate-change-kg/;
    }

    # The KG: landing page (/climate-change-kg/), SPARQL endpoint (/climate-change-kg/sparql),
    # SPARQL editor (/climate-change-kg/sparql-ui/), linked data (/climate-change-kg/id/...,
    # where w3id.org sends https://w3id.org/climate-change-kg/data/...).
    location = /climate-change-kg {
        return 301 /climate-change-kg/;
    }

    location /climate-change-kg/ {
        proxy_pass http://127.0.0.1:8081/;   # the trailing slash strips the prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Legacy namespace: /hacid-cs-kg was renamed to /climate-change-kg.
    # 308 (not 301/302) so that POSTed SPARQL queries keep their method and body.
    location ~ ^/hacid-cs-kg(?<legacy_rest>/.*)?$ {
        return 308 /climate-change-kg$legacy_rest$is_args$args;
    }

    # The endpoint of the cases of the HACID DSS (GraphDB repository climate-change-kg-write of
    # climate-change-kg-docker) is not part of knowledge-graph-serve. To keep serving it, see
    # deployment/README.md ("The cases endpoint"), then uncomment:
    # location ~ ^/hacid-cs-kg-cases(?<legacy_cases_rest>/.*)?$ {
    #     return 308 /climate-change-kg-cases$legacy_cases_rest$is_args$args;
    # }
    #
    # location /climate-change-kg-cases/sparql {
    #     proxy_pass http://127.0.0.1:7200/repositories/climate-change-kg-write;
    # }
}
