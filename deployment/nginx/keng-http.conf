# keng.istc.cnr.it, port 80: the HTTP challenges of Let's Encrypt, for the certificate and its
# renewals (certbot, webroot /var/www/letsencrypt), and a redirect to HTTPS for the rest.
# Installed in /etc/nginx/sites-available/ by deployment/install.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name keng.istc.cnr.it www.keng.istc.cnr.it;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://keng.istc.cnr.it$request_uri;
    }
}
